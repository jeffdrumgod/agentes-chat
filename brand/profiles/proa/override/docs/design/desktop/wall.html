<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop wallpaper</title>
<!-- The agents' desktop wallpaper (1280×900), drawn by out/wall.js: render.sh screenshots this page. -->
<style>
/* Proa: the wordmark in Nunito ExtraBold, as the app's logo (brand-font.css, brand-logo.css). */
@font-face {
  font-family: "Nunito";
  font-weight: 800;
  src: url("../../../apps/web/src/fonts/nunito-800-latin.woff2") format("woff2");
}
html, body { margin: 0; overflow: hidden; background: #000; }
.wall { position: relative; width: 1280px; height: 900px; overflow: hidden; }
.wall > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
/* The logo as the app draws it (packages/ui Logo, components.css .ac-logo): Timo's mark, then "Proa". */
.logo {
  position: absolute;
  display: inline-flex;
  align-items: center;
  gap: 0.16em;
  font-family: "Nunito";
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1;
  white-space: nowrap;
}
.logo img { width: 1.25em; height: 1.25em; flex: none; display: block; }
</style>
</head>
<body>
<div class="wall"><canvas></canvas></div>
<script src="out/wall.js"></script>
</body>
</html>
